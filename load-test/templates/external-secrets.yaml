# Copies of the User and Credit database logins for load-setup.
{{- range list "user" "credit" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ . }}-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secretStore is required" $.Values.secretStore }}
  target:
    name: {{ . }}-db
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ printf "%s%s-db" (required "secretPrefix is required" $.Values.secretPrefix) . }}
        property: DATABASE_URL
{{- end }}
