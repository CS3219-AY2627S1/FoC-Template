# Shared by the long-running user service and its bootstrap-only job
x-user-service-env: &user-service-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME}
  SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME}
  SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
  JWT_PRIVATE_KEY_LOCATION: file:/app/keys/private.pem
  JWT_PUBLIC_KEY_LOCATION: file:/app/keys/public.pem
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  USER_CORS_ALLOWED_ORIGINS: ${USER_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093  # Single broker

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  # Debezium on Kafka Connect: streams each service's outbox table to Kafka (one topic per event type)
  kafka-connect:
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Connector configs read DB credentials as ${env:...} instead of hard-coding them
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      SUPPLIER_DB_NAME: ${SUPPLIER_DB_NAME}
      SUPPLIER_DB_USERNAME: ${SUPPLIER_DB_USERNAME}
      SUPPLIER_DB_PASSWORD: ${SUPPLIER_DB_PASSWORD}
      CREDIT_DB_NAME: ${CREDIT_DB_NAME}
      CREDIT_DB_USERNAME: ${CREDIT_DB_USERNAME}
      CREDIT_DB_PASSWORD: ${CREDIT_DB_PASSWORD}
      CHAT_DB_NAME: ${CHAT_DB_NAME:-campuscouriers_chat}
      CHAT_DB_USERNAME: ${CHAT_DB_USERNAME:-chat_service}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-password}
    depends_on:
      - kafka
      - user-db
      - order-db
      - supplier-db
      - credit-db
      - chat-db
    networks:
      - default
      - user-net
    restart: unless-stopped

  # One-off job: registers the connectors in ./debezium/connectors (idempotent), then exits
  connect-init:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/register-connectors.sh"]
    environment:
      CONNECT_URL: http://kafka-connect:8083
    volumes:
      - ./debezium/connectors:/connectors:ro
      - ./debezium/register-connectors.sh:/register-connectors.sh:ro
    depends_on:
      - kafka-connect
    restart: "no"
  
  credit-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium reads the outbox from the WAL
    environment:
      POSTGRES_DB: ${CREDIT_DB_NAME}
      POSTGRES_USER: ${CREDIT_DB_USERNAME}
      POSTGRES_PASSWORD: ${CREDIT_DB_PASSWORD}
    ports:
      - "${CREDIT_DB_PORT:-5431}:5432"
    volumes:
      - credit-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${CREDIT_DB_USERNAME} -d ${CREDIT_DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  credit-service:
    build: ./credit-service
    image: campuscouriers/credit-service
    environment:
      DB_HOST: credit-db
      DB_PORT: 5432
      DB_NAME: ${CREDIT_DB_NAME}
      DB_USERNAME: ${CREDIT_DB_USERNAME}
      DB_PASSWORD: ${CREDIT_DB_PASSWORD}
      USER_SERVICE_URL: ${USER_SERVICE_DOCKER_URL:-http://user-service:8080}
      SUPPLIER_SERVICE_URL: ${SUPPLIER_SERVICE_DOCKER_URL:-http://supplier-service:8080}
      JWT_ISSUER: ${JWT_ISSUER:-campuscouriers-user-service}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_CREDIT_SERVICE_KEY: ${ORDER_CREDIT_SERVICE_KEY:-}
    ports:
      - "${CREDIT_SERVICE_PORT:-8001}:8080"
    depends_on:
      credit-db:
        condition: service_healthy
    restart: unless-stopped


  order-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium reads the outbox from the WAL
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USERNAME}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "${ORDER_DB_PORT:-5435}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ORDER_DB_USERNAME} -d ${ORDER_DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  order-service:
    build: ./order-service
    image: campuscouriers/order-service
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: ${ORDER_DB_NAME}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      USER_SERVICE_URL: ${USER_SERVICE_DOCKER_URL:-http://user-service:8080}
      SUPPLIER_SERVICE_URL: ${SUPPLIER_SERVICE_DOCKER_URL:-http://supplier-service:8080}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_DOCKER_URL:-http://credit-service:8080}
      CREDIT_SERVICE_TIMEOUT: ${CREDIT_SERVICE_TIMEOUT:-5}
      ORDER_CREDIT_SERVICE_KEY: ${ORDER_CREDIT_SERVICE_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-campuscouriers-user-service}
      ORDER_CORS_ALLOWED_ORIGINS: ${ORDER_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${ORDER_SERVICE_PORT:-8002}:8000"
    depends_on:
      order-db:
        condition: service_healthy
    restart: unless-stopped

  ai-errand-assistant-service:
    build: ./ai-errand-assistant-service
    image: campuscouriers/ai-errand-assistant-service
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_DOCKER_URL:-http://user-service:8080}
      SUPPLIER_SERVICE_URL: ${SUPPLIER_SERVICE_DOCKER_URL:-http://supplier-service:8080}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_DOCKER_URL:-http://order-service:8000}
      JWT_ISSUER: ${JWT_ISSUER:-campuscouriers-user-service}
      CORS_ALLOWED_ORIGINS: ${AI_ASSISTANT_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Singapore}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_DRAFT_RATE_LIMIT: ${AI_DRAFT_RATE_LIMIT:-10}
      AI_DRAFT_RATE_WINDOW_SECONDS: ${AI_DRAFT_RATE_WINDOW_SECONDS:-60}
      CATALOG_CACHE_SECONDS: ${CATALOG_CACHE_SECONDS:-60}
    ports:
      - "${AI_ASSISTANT_SERVICE_PORT:-8005}:8000"
    depends_on:
      - user-service
      - supplier-service
      - order-service
    restart: unless-stopped

  chat-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME:-campuscouriers_chat}
      POSTGRES_USER: ${CHAT_DB_USERNAME:-chat_service}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-password}
    ports:
      - "${CHAT_DB_PORT:-5436}:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${CHAT_DB_USERNAME:-chat_service} -d ${CHAT_DB_NAME:-campuscouriers_chat}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  chat-service:
    build: ./chat-service
    image: campuscouriers/chat-service
    environment:
      DB_HOST: chat-db
      DB_PORT: 5432
      DB_NAME: ${CHAT_DB_NAME:-campuscouriers_chat}
      DB_USERNAME: ${CHAT_DB_USERNAME:-chat_service}
      DB_PASSWORD: ${CHAT_DB_PASSWORD:-password}
      USER_SERVICE_URL: ${USER_SERVICE_DOCKER_URL:-http://user-service:8080}
      JWT_ISSUER: ${JWT_ISSUER:-campuscouriers-user-service}
      KAFKA_CONSUMER_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_CHAT_GROUP_ID: ${KAFKA_CHAT_GROUP_ID:-chat-service-lifecycle-v1}
      CHAT_WS_TICKET_TTL_SECONDS: ${CHAT_WS_TICKET_TTL_SECONDS:-30}
      CHAT_CORS_ALLOWED_ORIGINS: ${CHAT_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${CHAT_SERVICE_PORT:-8003}:8000"
    depends_on:
      chat-db:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_started
    restart: unless-stopped

  supplier-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium reads the outbox from the WAL
    environment:
      POSTGRES_DB: ${SUPPLIER_DB_NAME}
      POSTGRES_USER: ${SUPPLIER_DB_USERNAME}
      POSTGRES_PASSWORD: ${SUPPLIER_DB_PASSWORD}
    ports:
      - "${SUPPLIER_DB_PORT:-5433}:5432"
    volumes:
      - supplier-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${SUPPLIER_DB_USERNAME} -d ${SUPPLIER_DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  supplier-service:
    build: ./supplier-service
    image: campuscouriers/supplier-service
    environment:
      DB_HOST: supplier-db
      DB_PORT: 5432
      DB_NAME: ${SUPPLIER_DB_NAME}
      DB_USERNAME: ${SUPPLIER_DB_USERNAME}
      DB_PASSWORD: ${SUPPLIER_DB_PASSWORD}
      SUPPLIER_CORS_ALLOWED_ORIGINS: ${SUPPLIER_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      USER_SERVICE_URL: ${USER_SERVICE_DOCKER_URL:-http://user-service:8080}
    ports:
      - "${SUPPLIER_SERVICE_PORT:-8082}:8080"
    depends_on:
      supplier-db:
        condition: service_healthy
    restart: unless-stopped

  user-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium reads the outbox from the WAL
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_PORT:-5434}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${USER_DB_USERNAME} -d ${USER_DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - user-net
    restart: unless-stopped

  user-service:
    build: ./user-service
    image: campuscouriers/user-service
    environment:
      <<: *user-service-env
    ports:
      - "${USER_SERVICE_PORT:-8081}:8080"
    volumes:
      - ./user-service/keys:/app/keys:ro
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - default
      - user-net
    restart: unless-stopped

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-campuscouriers_notification}
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:-notification_service}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-password}
    ports:
      - "${NOTIFICATION_DB_PORT:-5437}:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${NOTIFICATION_DB_USERNAME:-notification_service} -d ${NOTIFICATION_DB_NAME:-campuscouriers_notification}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    image: campuscouriers/notification-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_NAME: ${NOTIFICATION_DB_NAME:-campuscouriers_notification}
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-notification_service}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      USER_SERVICE_URL: ${USER_SERVICE_DOCKER_URL:-http://user-service:8080}
      JWT_ISSUER: ${JWT_ISSUER:-campuscouriers-user-service}
      NOTIFICATION_CORS_ALLOWED_ORIGINS: ${NOTIFICATION_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8004}:8080"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: campuscouriers/frontend
    environment:
      VITE_SUPPLIER_API_URL: ${VITE_SUPPLIER_API_URL:-http://localhost:8080}
      VITE_USER_API_URL: ${VITE_USER_API_URL:-http://localhost:8081}
      VITE_ORDER_API_URL: ${VITE_ORDER_API_URL:-http://localhost:8002}
      VITE_CREDIT_API_URL: ${VITE_CREDIT_API_URL:-http://localhost:8001}
      VITE_NOTIFICATION_API_URL: ${VITE_NOTIFICATION_API_URL:-http://localhost:8004}
      VITE_CHAT_API_URL: ${VITE_CHAT_API_URL:-http://localhost:8003}
      VITE_AI_ASSISTANT_API_URL: ${VITE_AI_ASSISTANT_API_URL:-http://localhost:8005}
      VITE_MOCK_AUTH: ${VITE_MOCK_AUTH:-false}
    ports:
      - "5173:5173"
    depends_on:
      - supplier-service
      - user-service
      - order-service
      - credit-service
      - chat-service
      - notification-service
      - ai-errand-assistant-service
    restart: unless-stopped

  # One-off job: creates the first administrator if none exists, then exits (non-zero on failure).
  # Only started explicitly: docker compose --profile jobs run --rm user-bootstrap
  user-bootstrap:
    build: ./user-service
    image: campuscouriers/user-service
    profiles:
      - jobs
    environment:
      <<: *user-service-env
      SPRING_PROFILES_ACTIVE: bootstrap-admin
    volumes:
      - ./user-service/keys:/app/keys:ro
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - user-net
    restart: "no"

  rag-database:
    image: pgvector/pgvector:pg16
    container_name: rag-database
    environment:
      POSTGRES_DB: ${RAG_DB_NAME:-rag_db}
      POSTGRES_USER: ${RAG_DB_USERNAME:-rag_user}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-rag_password}
    ports:
      - "${RAG_DB_PORT:-5438}:5432"
    volumes:
      - rag-database-data:/var/lib/postgresql/data
      - ./RAG-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${RAG_DB_USERNAME:-rag_user} -d ${RAG_DB_NAME:-rag_db}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rag-index:
    build: ./RAG-service
    profiles:
      - jobs
    environment:
      DATABASE_URL: postgresql://${RAG_DB_USERNAME:-rag_user}:${RAG_DB_PASSWORD:-rag_password}@rag-database:5432/${RAG_DB_NAME:-rag_db}
      CHUNKS_FILE: /app/ingestion/chunks.csv
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    volumes:
      - ./RAG-service/ingestion/chunks.csv:/app/ingestion/chunks.csv:ro
    depends_on:
      rag-database:
        condition: service_healthy
    restart: "no"

  rag-service:
    build: ./RAG-service
    environment:
      DATABASE_URL: postgresql://${RAG_DB_USERNAME:-rag_user}:${RAG_DB_PASSWORD:-rag_password}@rag-database:5432/${RAG_DB_NAME:-rag_db}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_CORS_ALLOWED_ORIGINS: ${RAG_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # /query requires a signed-in user's access token, checked against user-service's keys
      USER_SERVICE_URL: ${USER_SERVICE_DOCKER_URL:-http://user-service:8080}
      JWT_ISSUER: ${JWT_ISSUER:-campuscouriers-user-service}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-2048}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-low}
    ports:
      - "${RAG_SERVICE_PORT:-8005}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      rag-database:
        condition: service_healthy
    restart: unless-stopped

networks:
  user-net:

volumes:
  order-db-data:
  supplier-db-data:
  user-db-data:
  credit-db-data:
  rag-database-data:
  notification-db-data:
  chat-db-data:


