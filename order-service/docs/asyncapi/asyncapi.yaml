        orderId:
          type: string
          minLength: 1
        courierId:
          type: string
          minLength: 1
        penaltyAmount:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        appliedReason:
          type: string
          const: SUCCESSFUL_DELIVERY
        courierSequence:
          type: integer
          minimum: 1
    OpenOrderRefundTaskEvent:
      type: object
      additionalProperties: false
