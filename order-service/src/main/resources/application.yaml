spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/order_service_dev}
    username: ${SPRING_DATASOURCE_USERNAME:order_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:local_dev_only}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/orders/v3/api-docs
  swagger-ui:
    path: /api/orders/docs

order:
  report-demo:
    enabled: ${ORDER_REPORT_DEMO_ENABLED:false}
  security:
    auth:
      project-id: ${FIREBASE_AUTH_PROJECT_ID:demo-foc}
      emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
    user-service:
      mode: ${USER_SERVICE_MODE:mock}
      base-url: ${USER_SERVICE_URL:http://localhost:8081}
      mock-admin-emails: ${MOCK_ADMIN_EMAILS:}
      timeout: ${USER_SERVICE_TIMEOUT:3s}
  peers:
    mode: ${ORDER_PEERS_MODE:mock}
    user-url: ${USER_SERVICE_URL:http://localhost:8081}
    supplier-url: ${SUPPLIER_SERVICE_URL:http://localhost:8082}
    credit-url: ${CREDIT_SERVICE_URL:http://localhost:8084}
    connect-timeout: ${ORDER_PEER_CONNECT_TIMEOUT:3s}
    read-timeout: ${ORDER_PEER_READ_TIMEOUT:5s}
  commands:
    enabled: ${ORDER_COMMANDS_ENABLED:true}
    recovery-policy: ${ORDER_COMMAND_RECOVERY_POLICY:retry}
    resolution-seconds: ${ORDER_COMMAND_RESOLUTION_SECONDS:120}
    lease-seconds: ${ORDER_COMMAND_LEASE_SECONDS:120}
    retry-seconds: ${ORDER_COMMAND_RETRY_SECONDS:15}
    batch-size: ${ORDER_COMMAND_BATCH_SIZE:20}
    compensation:
      enabled: ${ORDER_COMPENSATION_ENABLED:false}
      request-topic: ${ORDER_COMPENSATION_REQUEST_TOPIC:}
      result-subscription: ${ORDER_COMPENSATION_RESULT_SUBSCRIPTION:}
      push-mode: ${ORDER_COMPENSATION_PUSH_MODE:google}
      audience: ${ORDER_COMPENSATION_PUSH_AUDIENCE:}
      service-account: ${ORDER_COMPENSATION_PUSH_SERVICE_ACCOUNT:}
  reports:
    creation:
      enabled: ${ORDER_REPORT_CREATION_ENABLED:false}
      result-topic: ${REPORT_CREATION_COMPENSATION_RESULT_TOPIC:}
      request-subscription: ${ORDER_REPORT_CREATION_COMPENSATION_SUBSCRIPTION:}
      push-mode: ${ORDER_REPORT_CREATION_PUSH_MODE:google}
      audience: ${ORDER_REPORT_CREATION_PUSH_AUDIENCE:}
      service-account: ${ORDER_REPORT_CREATION_PUSH_SERVICE_ACCOUNT:}
    resolution:
      enabled: ${ORDER_REPORT_RESOLUTION_ENABLED:false}
      base-url: ${REPORT_SERVICE_URL:}
      timeout: ${ORDER_REPORT_RESOLUTION_TIMEOUT:5s}
      compensation-topic: ${ORDER_REPORT_COMPENSATION_TOPIC:}
      result-topic: ${REPORT_COMPENSATION_RESULT_TOPIC:}
      result-subscription: ${ORDER_REPORT_COMPENSATION_RESULT_SUBSCRIPTION:}
      push-mode: ${ORDER_REPORT_COMPENSATION_PUSH_MODE:google}
      audience: ${ORDER_REPORT_COMPENSATION_PUSH_AUDIENCE:}
      service-account: ${ORDER_REPORT_COMPENSATION_PUSH_SERVICE_ACCOUNT:}
  lifecycle-token: ${ORDER_LIFECYCLE_TOKEN:local-lifecycle}
  messaging:
    mode: ${ORDER_MESSAGING_MODE:cloud}
    emulator-host: ${PUBSUB_EMULATOR_HOST:}
    project-id: ${PUBSUB_PROJECT_ID:protean-vigil-509704-q4}
    publish-timeout: 10s
    outbox:
      recovery-cron: ${ORDER_OUTBOX_RECOVERY_CRON:0 */15 * * * *}
      batch-size: ${ORDER_OUTBOX_BATCH_SIZE:50}
    topics:
      order-completion: ${ORDER_COMPLETION_TOPIC:order-completion-dev-v1}
      open-order-refund: ${ORDER_OPEN_REFUND_TOPIC:open-order-refund-dev-v1}
      courier-penalty-event: ${ORDER_COURIER_PENALTY_EVENT_TOPIC:courier-penalty-event-dev-v1}
      courier-penalty-addition: ${ORDER_COURIER_PENALTY_ADDITION_TOPIC:courier-penalty-addition-dev-v1}
      courier-penalty-deduction: ${ORDER_COURIER_PENALTY_DEDUCTION_TOPIC:courier-penalty-deduction-dev-v1}
  lifecycle:
    automatic-repost-enabled: ${ORDER_AUTO_REPOST_ENABLED:false}
    external-enabled: ${ORDER_LIFECYCLE_EXTERNAL_ENABLED:false}
    cron: ${ORDER_LIFECYCLE_CRON:0 * * * * *}
