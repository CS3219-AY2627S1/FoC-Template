apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mailpit
    {{- include "foc-lib.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: {{ .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: smtp
              containerPort: {{ .Values.smtpPort }}
            - name: http
              containerPort: {{ .Values.uiPort }}
          readinessProbe:
            exec:
              command: ["/mailpit", "readyz"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
