apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mailpit
    {{- include "foc-lib.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: {{ .Values.smtpPort }}
      targetPort: smtp
    - name: http
      port: {{ .Values.uiPort }}
      targetPort: http
