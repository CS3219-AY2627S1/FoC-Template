{{- $ing := .Values.grafana.ingress }}
{{- if $ing.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    {{- include "foc-lib.labels" . | nindent 4 }}
  {{- if $ing.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $ing.tls.issuer }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.className | default "traefik" }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        - {{ $ing.host | quote }}
      secretName: {{ $ing.tls.secretName | default "grafana-tls" }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
{{- end }}
