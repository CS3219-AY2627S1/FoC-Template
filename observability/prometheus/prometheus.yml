# AI-influenced: implemented with AI assistance; see ai/usage-log.md.
# Prometheus for the FoC observability stack.
#
#   docker compose --profile observability up -d prometheus grafana
#
# Every instrumented service exposes /metrics **inside** the compose network
# (the API gateway is the only public entry point and does not proxy it).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: credit-service
    metrics_path: /metrics
    static_configs:
      - targets: ["credit-service:8000"]
        labels:
          service: credit-service

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:8000"]
        labels:
          service: user-service

  - job_name: supplier-service
    metrics_path: /metrics
    static_configs:
      - targets: ["supplier-service:8000"]
        labels:
          service: supplier-service

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:8000"]
        labels:
          service: order-service

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8000"]
        labels:
          service: notification-service

  - job_name: chat-service
    metrics_path: /metrics
    static_configs:
      - targets: ["chat-service:8000"]
        labels:
          service: chat-service

  # The gateway is the edge: its metrics show 401/403/404/5xx that never reach
  # a backend. Its route label is collapsed to /api/<service>/* so it does not
  # duplicate the per-service panels. Its /metrics lives on the internal-only
  # port 9100 (GATEWAY_METRICS_PORT), never on the public proxy port.
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:9100"]
        labels:
          service: api-gateway

  # Broker-side metrics (queue depth, unacked, consumer count). RabbitMQ does
  # not produce application traces; this is the broker's own view of the async
  # path, and it complements the application-side consumer gauges.
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq
