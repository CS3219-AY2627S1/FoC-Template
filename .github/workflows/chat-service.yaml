# AI Assistance Disclosure: Claude Code (Claude Opus 5.5), 2026-11-12.
# Scope: chat-service CI (build, image publish) and CD (deploy to EKS), copied from supplier-service.yaml.
# Details: ai/usage-log.md, entry 007.

name: Chat Service CI

on:
  push:
    branches: [main]
    paths: &chat_ci_paths
      - 'chat-service/**'
      - '.github/workflows/chat-service.yaml'
      - 'k8s/chat-service/**'
  pull_request:
    paths: *chat_ci_paths

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Nested under the repo name so GITHUB_TOKEN can publish (GHCR lowercases this).
  IMAGE_NAME: ${{ github.repository }}/chat-service

jobs:
  build:
    runs-on: ubuntu-latest
    # chat-service is not a root npm workspace and does not use shared/;
    # it has its own package-lock.json.
    defaults:
      run:
        working-directory: chat-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-service/package-lock.json

      - run: npm ci
      - run: npm run build

  build-and-push-image:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm SHA is still the branch tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if ! current=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha); then
            echo "Could not verify branch tip; skipping mutable latest tag"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "SHA ${{ github.sha }} is no longer the tip of ${{ github.ref_name }} ($current)"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.tip.outputs.stale != 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: chat-service
          file: chat-service/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD only: runs after the image for this commit is pushed on main.
  deploy:
    needs: build-and-push-image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::200340799641:role/foc-github-deploy
          aws-region: ap-southeast-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to EKS
        run: |
          set -euo pipefail
          if ! aws eks describe-cluster --name foc >/tmp/cluster.out 2>/tmp/cluster.err; then
            echo "::warning title=EKS unavailable::Cluster foc is down; skipping deploy of sha-${GITHUB_SHA}"
            echo "--- aws error ---"
            cat /tmp/cluster.err
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws eks update-kubeconfig --name foc --region ap-southeast-1
          sed -i "s/newTag: latest/newTag: sha-${GITHUB_SHA}/" k8s/chat-service/kustomization.yaml
          kubectl apply -k k8s/chat-service
          kubectl -n foc rollout status statefulset/chat-db --timeout=5m
          kubectl -n foc rollout status deployment/chat-service --timeout=5m
