apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "grafanaAdmin.secretStore is required" .Values.grafanaAdmin.secretStore }}
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "grafanaAdmin.remoteKey is required" .Values.grafanaAdmin.remoteKey }}
        property: admin-password
