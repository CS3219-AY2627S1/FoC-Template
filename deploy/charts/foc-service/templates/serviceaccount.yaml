# The service's own identity. Under Linkerd (ADR-0012) this is what policies
# name: <name>.<namespace>.serviceaccount.identity.linkerd.cluster.local.
# The app never calls the Kubernetes API, so its token isn't mounted (Linkerd's
# proxy gets its own projected token).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foc-service.name" . }}
  labels:
    {{- include "foc-service.labels" . | nindent 4 }}
automountServiceAccountToken: false
