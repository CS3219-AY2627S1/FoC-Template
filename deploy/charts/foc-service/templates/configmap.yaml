apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foc-service.name" . }}
  labels:
    {{- include "foc-service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
