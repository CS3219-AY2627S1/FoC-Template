{{- /* Cloud only, see externalSecrets in values.yaml. */ -}}
{{- range $name, $keys := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "foc-service.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secretStore.name is required with externalSecrets" $.Values.secretStore.name }}
  target:
    name: {{ $name }}
  data:
    {{- range $keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s%s" $.Values.secretStore.prefix $name }}
        property: {{ . }}
    {{- end }}
{{- end }}
