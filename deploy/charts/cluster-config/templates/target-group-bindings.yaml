{{- range .Values.envs }}
# The AWS Load Balancer Controller keeps env {{ .name }}'s Envoy proxy pods
# registered in its NLB's target group (infra/<cluster>/aws/gateway-lb.tf),
# by pod IP, as they come and go. Security group rules are Terraform's too.
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: gateway-{{ .name }}
  namespace: {{ $.Values.envoyNamespace }}
spec:
  serviceRef:
    name: envoy-{{ .namespace }} # charts/foc-gateway's envoyServiceName default
    port: 80
  targetGroupARN: {{ required "envs[].gatewayTargetGroupArn is required" .gatewayTargetGroupArn }}
  targetType: ip
---
{{- end }}
