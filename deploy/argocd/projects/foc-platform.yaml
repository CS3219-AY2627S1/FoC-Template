# Cluster-wide platform components (Strimzi operator, Envoy Gateway, cert-manager,
# trust-manager, Linkerd, AWS Load Balancer Controller, External Secrets, Prometheus: CRDs, ClusterRoles, GatewayClass, ClusterIssuers).
# Admin-level: only reviewed changes should land here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: foc-platform
  namespace: argocd
spec:
  description: FoC platform operators (cluster-scoped resources allowed)
  sourceRepos:
    - https://github.com/junngithub/AY2627S1-CS3219-P15.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: strimzi
    - server: https://kubernetes.default.svc
      namespace: envoy-gateway-system
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: linkerd
    # AWS glue (ADR-0013): Load Balancer Controller, cluster-config.
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: monitoring
    # Strimzi creates RoleBindings in the namespaces it watches.
    - server: https://kubernetes.default.svc
      namespace: "foc*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
