# dev and stg share the non-prod nodes; each gets half-ish of them.
quota:
  requests.cpu: "2"
  requests.memory: 5Gi
  limits.cpu: "6" # +200m per Linkerd proxy (ADR-0012), incl. rollout surge and mesh tests
  limits.memory: 10Gi
  persistentvolumeclaims: "10"
  pods: "40"
networkPolicy:
  # Envoy proxies (charts/foc-gateway) route traffic in and call User's /authorize.
  allowFromNamespaces: [envoy-gateway-system]
