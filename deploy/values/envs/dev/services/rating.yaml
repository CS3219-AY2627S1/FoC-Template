# No rating-service image that runs in the cloud yet: run the connectivity stub
# under this name (same as local). CI pushes foc/connectivity-stub.
image:
  name: foc/connectivity-stub
  tag: "0.2.0"
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilization: 70
resources:
  requests: { cpu: 250m }
  limits: { cpu: "1" }
