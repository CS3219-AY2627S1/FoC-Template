image:
  tag: "89c5dae89fcdf1652826b5569d1647e87f9d9b07" # git SHA, set by deploy/push-dev.sh
autoscaling:
  enabled: true
  # Idle/dev. Full-run peak needs min=max=8 — see load-test/README.md
