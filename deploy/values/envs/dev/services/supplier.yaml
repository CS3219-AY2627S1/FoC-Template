image:
  tag: "e30d3f1ac000b9f608688041207ffa34c9a42d12" # git SHA, set by deploy/push-dev.sh
autoscaling:
  enabled: true
  # Idle/dev. Full-run peak needs min=max=8 — see load-test/README.md
  # "Scale up / scale down". Create validates pickup (Order also caches ~5m).
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilization: 70
resources:
  requests: {cpu: 250m}
  limits: {cpu: "1"}
