image:
  tag: "5ec616ba9b86e8ead4eaae928dd4c7fa15d6de66" # git SHA, set by deploy/push-dev.sh
autoscaling:
  enabled: true
  # Create validates pickup; Order also caches approved places ~5m, but keep
