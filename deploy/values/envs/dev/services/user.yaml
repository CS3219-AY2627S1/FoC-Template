image:
  tag: "a1e0a6ffaa6feffcba3a035870ce84a0ccc6015e" # git SHA, set by deploy/push-dev.sh
# Only one replica may poll the Telegram bot: before adding a bot token, run
# the poller separately and set TELEGRAM_POLLING_ENABLED=false here.
autoscaling:
  enabled: true
  # Create path looks up telegram on every order; CPU HPA is blind to that I/O.
  # Pin min=max so peers stay warm under 9600 VU peak (same pattern as Order).
  minReplicas: 8
  maxReplicas: 8
  targetCPUUtilization: 70
resources:
  requests: {cpu: 250m}
  limits: {cpu: "1"}
env:
  APP_ENV: dev
  # minReplicas=4 for load: only one process may poll a bot. Polling spam was
  # starving User under smoke and Order create returned 503 USER_FAILED.
  TELEGRAM_POLLING_ENABLED: "false"
  # Password-reset links point here.
  FRONTEND_BASE_URL: https://djj7vqja8at5u.cloudfront.net
  # OTP and reset emails through SES; the node role may send only as this
  # verified address (infra/nonprod/aws/ses.tf, node-permissions.tf). While SES is
  # in the sandbox, only verified recipients get mail.
  EMAIL_PROVIDER: ses
  # Not u.nus.edu: its DMARC policy is p=reject, so mail SES sends "from" it
  # is refused (550 5.7.509). gmail.com is p=none: delivered, often to Junk.
  # A domain we own, DKIM-verified in SES, would fix that.
  SES_FROM_EMAIL: donleehh420@gmail.com
  AWS_REGION: ap-southeast-1
  # Until the Telegram bot exists, an admin can mark users verified
  # (POST /api/v1/user/admin/users/{id}/verify). Never in prod.
  ENABLE_TEST_VERIFICATION: "true"
# Secrets from Secrets Manager foc/dev/<name> (infra/nonprod/aws/secrets.tf).
externalSecrets:
  user-otp: [OTP_SECRET]
  # Placeholder until the bot exists: paste token + username into foc/dev/user-telegram.
  user-telegram: [TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME]
