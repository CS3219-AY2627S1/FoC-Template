[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foc-user-service"
version = "0.1.0"
description = "FoC User Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aio-pika>=9.5,<10",
  "asyncpg>=0.30,<1.0",
  "bcrypt>=4.2,<6.0",
  "boto3>=1.40,<2",
  "cryptography>=44,<46",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
bootstrap-super-admin = "app.admin.bootstrap:main"
outbox-publisher = "app.outbox.worker:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires a configured local Supabase PostgreSQL test database",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
