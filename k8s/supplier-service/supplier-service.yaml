apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier-service
  namespace: foc
  labels: { app.kubernetes.io/name: supplier-service, app.kubernetes.io/part-of: foc }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: supplier-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: supplier-service, app.kubernetes.io/part-of: foc }
    spec:
      # nodeSelector: { role: supplier }   # enable on EC2; leave off for local k3d
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                  # the image's "node" user
      terminationGracePeriodSeconds: 30
      containers:
        - name: supplier-service
          image: ghcr.io/ay2627s1-cs3219-p22/foc/supplier-service:latest
          imagePullPolicy: Always   # latest moves on every build, so always check GHCR
          ports:
            - { name: grpc, containerPort: 50052 }
            - { name: http, containerPort: 3002 }
          envFrom:  # loads settings and secrets from the other yaml files
            - configMapRef: { name: supplier-config }
            - secretRef: { name: supplier-secrets }
          volumeMounts:
            - name: user-public-key
              mountPath: /app/keys/public.pem
              subPath: public.pem
              readOnly: true
            - name: logs
              mountPath: /repo/supplier-service/logs
          readinessProbe:  # calls /health every 10s and stops sending traffic to the pod if it keeps failing, for eg if database is down
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe: # checks that grpc port accepts connections and restarts container if it keeps failing
            tcpSocket: { port: grpc }
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:  # waits 5s before shutdown so traffic can move away, allows 30s in total
              sleep: { seconds: 5 }       # let traffic drain before SIGTERM
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: 
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: user-public-key
          configMap: { name: user-public-key }
        - name: logs
          emptyDir: {}
---  # how other pods reach the app
apiVersion: v1
kind: Service
metadata:
  name: supplier-service
  namespace: foc
  labels: { app.kubernetes.io/name: supplier-service, app.kubernetes.io/part-of: foc }
spec:
  clusterIP: None # headless: DNS returns every pod IP so gRPC clients can balance across pods
  selector: { app.kubernetes.io/name: supplier-service }
  ports:
    - { name: grpc, port: 50052, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: 3002, targetPort: http }
